<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title description">
  <title id="title">Shopizer source evidence to business requirements</title>
  <desc id="description">Shopizer API, service, model, and test evidence is inventoried, grouped into capabilities, drafted as requirements, and reviewed by stakeholders.</desc>
  <rect width="1000" height="290" fill="#f4f6f8" />
  <g font-family="sans-serif" text-anchor="middle">
    <g fill="#ffffff" stroke="#356859" stroke-width="2"><rect x="35" y="85" width="190" height="90" rx="8"/><rect x="280" y="85" width="190" height="90" rx="8"/><rect x="525" y="85" width="190" height="90" rx="8"/><rect x="770" y="85" width="190" height="90" rx="8"/></g>
    <g fill="#263238" font-size="16"><text x="130" y="120">Shopizer APIs,</text><text x="130" y="145">services, tests</text><text x="375" y="120">Cited behavior</text><text x="375" y="145">and gaps</text><text x="620" y="120">BRD capability</text><text x="620" y="145">draft</text><text x="865" y="120">Product-owner</text><text x="865" y="145">review</text></g>
    <g stroke="#356859" stroke-width="3" fill="none"><path d="M225 130h50m-10-8 10 8-10 8"/><path d="M470 130h50m-10-8 10 8-10 8"/><path d="M715 130h50m-10-8 10 8-10 8"/></g>
    <text x="500" y="235" fill="#546e7a" font-size="15">Observed implementation is evidence, not automatically approved business policy.</text>
  </g>
</svg>