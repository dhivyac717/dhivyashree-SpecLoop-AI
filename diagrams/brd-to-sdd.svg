<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title description">
  <title id="title">Shopizer business requirements to software design</title>
  <desc id="description">Reviewed Shopizer capability requirements are mapped to the existing API, facade, core service, and model boundaries, then checked for compatibility.</desc>
  <rect width="1000" height="290" fill="#f4f6f8" />
  <g font-family="sans-serif" text-anchor="middle">
    <g fill="#ffffff" stroke="#52717b" stroke-width="2"><rect x="45" y="85" width="190" height="90" rx="8"/><rect x="285" y="85" width="190" height="90" rx="8"/><rect x="525" y="85" width="190" height="90" rx="8"/><rect x="765" y="85" width="190" height="90" rx="8"/></g>
    <g fill="#263238" font-size="16"><text x="140" y="120">Reviewed Shopizer</text><text x="140" y="145">requirements</text><text x="380" y="120">Existing API</text><text x="380" y="145">and facade</text><text x="620" y="120">Core services</text><text x="620" y="145">and models</text><text x="860" y="120">Compatibility</text><text x="860" y="145">and test plan</text></g>
    <g stroke="#356859" stroke-width="3" fill="none"><path d="M235 130h45m-10-8 10 8-10 8"/><path d="M475 130h45m-10-8 10 8-10 8"/><path d="M715 130h45m-10-8 10 8-10 8"/></g>
    <text x="500" y="235" fill="#546e7a" font-size="15">Design changes require explicit approval; this case study documents current boundaries.</text>
  </g>
</svg>