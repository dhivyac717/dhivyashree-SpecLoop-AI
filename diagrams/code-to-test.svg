<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title description">
  <title id="title">Shopizer implementation and test coverage</title>
  <desc id="description">API and service branches are compared to integration tests, missing scenarios become proposed tests, and execution status is reported separately.</desc>
  <rect width="1000" height="290" fill="#f4f6f8" />
  <g font-family="sans-serif" text-anchor="middle">
    <g fill="#ffffff" stroke="#a56a2a" stroke-width="2"><rect x="40" y="85" width="200" height="90" rx="8"/><rect x="285" y="85" width="200" height="90" rx="8"/><rect x="530" y="85" width="200" height="90" rx="8"/><rect x="775" y="85" width="190" height="90" rx="8"/></g>
    <g fill="#263238" font-size="16"><text x="140" y="120">Shopizer API</text><text x="140" y="145">and service paths</text><text x="385" y="120">Existing tests</text><text x="385" y="145">and status</text><text x="630" y="120">Missing-case</text><text x="630" y="145">proposals</text><text x="870" y="120">Execution</text><text x="870" y="145">results</text></g>
    <g stroke="#a56a2a" stroke-width="3" fill="none"><path d="M240 130h40m-10-8 10 8-10 8"/><path d="M485 130h40m-10-8 10 8-10 8"/><path d="M730 130h40m-10-8 10 8-10 8"/></g>
    <text x="500" y="235" fill="#546e7a" font-size="15">An unexecuted test suggestion is never reported as a passing test.</text>
  </g>
</svg>